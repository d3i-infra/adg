name: release

# Cut a release by pushing a tag:  git tag v4.0.0 && git push origin v4.0.0
# goreleaser builds the per-OS/arch adg binaries, publishes them to the GitHub
# Release for the tag, and pushes the AUR package; the npm steps then assemble
# @d3i-infra/adg + six platform packages from the build output and publish them.
# See RELEASING.md for the full flow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # goreleaser creates the Release and uploads assets via GITHUB_TOKEN
  id-token: write   # npm provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Current npm (trusted publishing needs 11.5.1+)
        run: npm install -g npm@latest && npm --version
      - name: Assemble npm packages
        run: node scripts/npm/build.mjs dist dist/npm
      - name: Publish npm packages
        # Auth: trusted publishing (the runner's OIDC identity, configured per package on
        # npmjs.com) once the packages exist. NPM_TOKEN is set only for the very first
        # publish, before any trusted publisher can be configured; with the secret absent
        # the env var is empty and the guard below both unsets it and strips the
        # _authToken line setup-node wrote into .npmrc, so npm falls through to OIDC
        # instead of failing with ENEEDAUTH (actions/setup-node#1551).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
            # setup-node wrote an _authToken=${NODE_AUTH_TOKEN} line; remove it so npm uses OIDC.
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          fi
          version=$(jq -r .version dist/metadata.json)
          tag=latest
          case "$version" in *-*) tag=next ;; esac   # prereleases never become `latest`
          for d in dist/npm/adg-*/; do npm publish "$d" --access public --provenance --tag "$tag"; done
          npm publish dist/npm/adg --access public --provenance --tag "$tag"
